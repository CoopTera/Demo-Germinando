<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <title>Germinando - Panel de Gestión</title>
  </head>
  <body>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        fetch('http://localhost:9999', { method: 'POST', body: JSON.stringify({type: 'error', message, stack: error ? error.stack : ''}) }).catch(console.error);
      };
      const origError = console.error;
      console.error = function(...args) {
        const parsedArgs = args.map(a => a instanceof Error ? a.stack : (typeof a === 'object' ? JSON.stringify(a, Object.getOwnPropertyNames(a)) : String(a)));
        fetch('http://localhost:9999', { method: 'POST', body: JSON.stringify({type: 'console.error', args: parsedArgs}) }).catch(origError);
        origError.apply(console, args);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
